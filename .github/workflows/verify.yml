name: Verify release files

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-release:
    name: Check version, HTML copies, and CSP
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify release consistency
        run: node scripts/verify-release.mjs
