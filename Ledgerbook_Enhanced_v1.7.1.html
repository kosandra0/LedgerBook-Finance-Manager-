<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Ledgerbook — Personal Finance Database</title>
<meta name="application-version" content="1.7.1">
<style>
:root{--bg:#f5f3ee;--surface:#fff;--surface2:#faf9f6;--ink:#22252a;--muted:#6a6e75;--faint:#9a9da3;--line:#e3dfd6;--line2:#eeebe4;--accent:#2b4a6f;--accent-ink:#fff;--inc:#2d7556;--exp:#a4443a;--sav:#2b5d86;--warn:#946512;--inc-bg:#e8f1ec;--exp-bg:#f6e9e7;--warn-bg:#f7efdc;--sel:#eef2f7;--rp:.45rem;--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[data-theme=dark]{--bg:#181a1d;--surface:#202327;--surface2:#1c1f22;--ink:#e6e6e3;--muted:#9a9ea5;--faint:#6f737a;--line:#31353a;--line2:#292c30;--accent:#8fb0d6;--accent-ink:#13181e;--inc:#6fbf9a;--exp:#e08a80;--sav:#85b2dc;--warn:#d9b062;--inc-bg:#1f2e27;--exp-bg:#33231f;--warn-bg:#352d1b;--sel:#262c33}
body[data-density=compact]{--rp:.18rem}body[data-density=comfortable]{--rp:.75rem}
*{box-sizing:border-box}
html{font-size:14px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.45;-webkit-font-smoothing:antialiased}
input,select,textarea,button{font:inherit;color:inherit}
h1,h2,h3,h4{font-weight:600;margin:0}
a{color:var(--accent)}
[hidden]{display:none!important}
.num,.r{text-align:right;font-variant-numeric:tabular-nums}
.inc{color:var(--inc)}.exp{color:var(--exp)}.sav{color:var(--sav)}.warn{color:var(--warn)}.muted{color:var(--muted)}.small{font-size:.86rem}.xs{font-size:.78rem}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);overflow:auto;padding:.9rem 0 1rem}
.brand{font-weight:700;font-size:1.05rem;padding:.2rem 1.1rem .9rem;letter-spacing:.01em}
.brand span{color:var(--muted);font-weight:400}
.ng{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);padding:.9rem 1.1rem .3rem}
.side a.nl{display:block;padding:.34rem 1.1rem;color:var(--ink);text-decoration:none;border-left:3px solid transparent}
.side a.nl:hover{background:var(--surface2)}
.side a.nl.on{border-left-color:var(--accent);background:var(--sel);font-weight:600}
.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.top{display:flex;align-items:center;gap:.8rem;padding:0 1.2rem;height:54px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.top form{flex:0 1 380px}
.top input[type=search]{width:100%}
.spacer{flex:1}
.menu-btn{display:none}
.saveind{font-size:.78rem;color:var(--muted);white-space:nowrap}
.saveind.flash{color:var(--inc)}
.clock{text-align:right;line-height:1.15;white-space:nowrap}
.clk-date{font-size:.74rem;color:var(--muted)}
.clk-time{font-size:.98rem;font-weight:600;font-variant-numeric:tabular-nums;display:flex;justify-content:flex-end;align-items:center}
.clk-time .dg{display:inline-block;overflow:hidden;height:1.25em;line-height:1.25em;width:.62em;text-align:center}
.clk-time .dg.tick{animation:rise .22s ease-out}
.clk-time .ap{font-size:.7rem;margin-left:.3rem;color:var(--muted);font-weight:500}
@keyframes rise{from{transform:translateY(60%);opacity:.1}to{transform:none;opacity:1}}
.content{flex:1;overflow:auto;padding:1.2rem 1.5rem 3rem}
.content:focus{outline:none}
.ph{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;margin-bottom:1rem}
.ph h1{font-size:1.3rem}
.ph .sub{color:var(--muted);font-size:.9rem}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin:1.5rem 0 .6rem}
.sh h3{font-size:.95rem}
.btn{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--line);background:var(--surface);padding:.38rem .8rem;border-radius:4px;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface2);border-color:var(--faint)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:var(--exp);border-color:var(--exp)}
.btn.danger.fill{background:var(--exp);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:.2rem .55rem;font-size:.86rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.lnk{background:none;border:0;color:var(--accent);cursor:pointer;padding:.1rem .3rem;text-decoration:none}
.lnk:hover{text-decoration:underline}.lnk.d{color:var(--exp)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:.38rem .55rem;min-width:0;max-width:100%}
input[type=checkbox],input[type=radio]{padding:0;accent-color:var(--accent)}
textarea{resize:vertical;width:100%}
input:disabled,select:disabled{background:var(--surface2);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:.9rem 1rem}
.card h3{font-size:.92rem;margin-bottom:.6rem}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.9rem}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.9rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.7rem}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:.65rem .85rem}
.kpi .l{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:1.3rem;font-weight:600;font-variant-numeric:tabular-nums;margin-top:.1rem;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:.78rem;color:var(--muted);min-height:1.1em}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:.4rem .6rem;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:.42rem .6rem;border-bottom:1px solid var(--line2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .r,.tbl th.r{text-align:right}
.tbl tfoot td{font-weight:600;border-top:1px solid var(--line)}
.tw{overflow:auto;border:1px solid var(--line);background:var(--surface);border-radius:4px}
.badge{display:inline-block;font-size:.72rem;padding:.05rem .45rem;border-radius:9px;background:var(--line2);color:var(--muted);white-space:nowrap}
.badge.inc{background:var(--inc-bg);color:var(--inc)}.badge.exp{background:var(--exp-bg);color:var(--exp)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.tr{background:var(--sel);color:var(--sav)}
.empty{text-align:center;color:var(--muted);padding:1.6rem 1rem;border:1px dashed var(--line);border-radius:4px;background:var(--surface2)}
.empty b{display:block;color:var(--ink);margin-bottom:.2rem}
.chart{min-height:120px;position:relative}
.chart svg{display:block;width:100%}
.chart .ax{fill:var(--muted);font-size:10.5px}
.chart .gl{stroke:var(--line2);stroke-width:1}
.chart .zl{stroke:var(--faint);stroke-width:1}
.chart .ctr{fill:var(--ink);font-size:13px;font-weight:600;text-anchor:middle}
.legend{display:flex;flex-wrap:wrap;gap:.2rem .9rem;font-size:.8rem;color:var(--muted);margin-top:.4rem}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:.3rem}
.donut{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.donut svg{width:170px;flex:none}
.dl{flex:1;min-width:170px;font-size:.84rem}
.dl div{display:flex;gap:.5rem;align-items:center;padding:.1rem 0}
.dl i{width:9px;height:9px;border-radius:2px;flex:none}
.dl span.n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb{font-size:.86rem}
.hb .row{display:grid;grid-template-columns:minmax(80px,32%) 1fr auto;gap:.6rem;align-items:center;padding:.18rem 0}
.hb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .tr{background:var(--line2);height:8px;border-radius:2px;overflow:hidden}
.hb .tr b{display:block;height:100%}
.prog{height:7px;background:var(--line2);border-radius:2px;overflow:hidden}
.prog b{display:block;height:100%;background:var(--sav)}
.prog.warn b{background:var(--warn)}.prog.over b{background:var(--exp)}.prog.ok b{background:var(--inc)}
.tbar,.fbar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-bottom:.6rem}
.tbar .q{flex:1 1 220px;min-width:160px}
.fpanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:.8rem;margin-bottom:.6rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.6rem}
.fpanel label{display:flex;flex-direction:column;gap:.15rem;font-size:.76rem;color:var(--muted)}
.fpanel input,.fpanel select{color:var(--ink);font-size:.95rem}
.bulk{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;padding:.45rem .7rem;background:var(--sel);border:1px solid var(--line);border-radius:4px;margin-bottom:.6rem;font-size:.9rem}
.tscroll{overflow:auto;max-height:max(380px,calc(100vh - 290px));border:1px solid var(--line);background:var(--surface);border-radius:4px}
table.grid{table-layout:fixed;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;min-width:100%}
.grid th{position:sticky;top:0;z-index:2;background:var(--surface2);border-bottom:1px solid var(--line);border-right:1px solid var(--line2);text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:.45rem .6rem;white-space:nowrap;overflow:hidden;user-select:none;cursor:pointer}
.grid th.r{text-align:right}
.grid th .rz{position:absolute;right:0;top:0;bottom:0;width:6px;cursor:col-resize}
.grid th .rz:hover{background:var(--accent);opacity:.4}
.grid th.dragover{box-shadow:inset 3px 0 0 var(--accent)}
.grid td{padding:var(--rp) .6rem;border-bottom:1px solid var(--line2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid th.ck,.grid td.ck{text-align:center;padding-left:.3rem;padding-right:.3rem;cursor:default}
.grid tr:hover td{background:var(--surface2)}
.grid tr.sel td{background:var(--sel)}
.grid tr.arch td{color:var(--faint);font-style:italic}
.grid .act{text-align:right;overflow:visible}
.pager{display:flex;gap:.6rem;align-items:center;justify-content:flex-end;padding:.5rem 0;font-size:.88rem;color:var(--muted);flex-wrap:wrap}
.chip{display:inline-block;font-size:.72rem;background:var(--line2);border-radius:3px;padding:0 .35rem;margin-right:.2rem}
.cdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:.4rem;vertical-align:baseline}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:.36rem .85rem;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;gap:1.1rem;border-bottom:1px solid var(--line);margin-bottom:.9rem}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:.4rem 0;cursor:pointer;color:var(--muted)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
dialog.dlg{border:1px solid var(--line);border-radius:6px;padding:0;width:min(560px,94vw);background:var(--surface);color:var(--ink);box-shadow:0 12px 40px rgba(0,0,0,.2)}
dialog.dlg.wide{width:min(840px,96vw)}
dialog::backdrop{background:rgba(20,22,26,.42)}
dialog[open]{animation:fadein .12s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.dform{display:flex;flex-direction:column;max-height:92vh}
.dform header{display:flex;justify-content:space-between;align-items:center;padding:.8rem 1.1rem;border-bottom:1px solid var(--line)}
.dform header h2{font-size:1.02rem}
.dform .x{background:none;border:0;font-size:1.4rem;line-height:1;cursor:pointer;color:var(--muted)}
.dbody{overflow:auto;padding:1rem 1.1rem}
.dform footer{display:flex;justify-content:flex-end;gap:.5rem;padding:.7rem 1.1rem;border-top:1px solid var(--line);background:var(--surface2);flex-wrap:wrap}
.derr{margin:0 1.1rem .7rem;padding:.5rem .7rem;background:var(--exp-bg);color:var(--exp);border-radius:4px;font-size:.9rem}
.derr ul{margin:0;padding-left:1.1rem}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem .9rem}
.f{display:flex;flex-direction:column;gap:.2rem;min-width:0}
.f.full{grid-column:1/-1}
.f>.lb{font-size:.8rem;color:var(--muted)}
.f .hint,.hint{font-size:.78rem;color:var(--faint)}
.f [aria-invalid=true]{border-color:var(--exp)}
.grp{display:flex;flex-wrap:wrap;gap:.3rem .9rem;padding:.2rem 0}
.grp label{display:flex;gap:.3rem;align-items:center;font-size:.92rem}
.note{font-size:.86rem;background:var(--surface2);border:1px solid var(--line);border-left:3px solid var(--accent);padding:.55rem .8rem;border-radius:3px;color:var(--muted)}
.note.warn{border-left-color:var(--warn);background:var(--warn-bg);color:var(--ink)}
.note.err{border-left-color:var(--exp);background:var(--exp-bg);color:var(--ink)}
#toasts{position:fixed;right:1rem;bottom:1rem;display:flex;flex-direction:column;gap:.4rem;z-index:100;max-width:min(420px,92vw)}
.toast{background:var(--ink);color:var(--bg);padding:.55rem .8rem;border-radius:4px;display:flex;gap:.8rem;align-items:center;font-size:.9rem;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.toast span{flex:1}.toast .lnk{color:inherit;text-decoration:underline}
.toast.error{background:var(--exp);color:#fff}.toast.ok{background:var(--inc);color:#fff}
[data-theme=dark] .toast.ok,[data-theme=dark] .toast.error{color:#101214}
.menu{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:4px;box-shadow:0 6px 20px rgba(0,0,0,.15);min-width:160px;padding:.25rem 0;max-height:70vh;overflow:auto}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:.38rem .9rem;cursor:pointer}
.menu button:hover{background:var(--surface2)}.menu button.d{color:var(--exp)}
.menu label{display:flex;gap:.5rem;align-items:center;padding:.3rem .9rem;cursor:pointer}
.menu .mi{display:flex;align-items:center}.menu .mi label{flex:1}.menu .mi button{width:auto;padding:.2rem .4rem}
#banner{padding:.6rem 1.2rem;background:var(--exp-bg);color:var(--exp);border-bottom:1px solid var(--line);font-size:.92rem}
#boot{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:200;padding:2rem;text-align:center}
#boot .bx{max-width:560px}
#lock{position:fixed;inset:0;background:var(--bg);z-index:150;display:flex;align-items:center;justify-content:center}
#lock .card{width:min(360px,92vw)}
#busy{position:fixed;inset:0;background:rgba(20,22,26,.35);z-index:120;display:flex;align-items:center;justify-content:center}
#busy .bb{background:var(--surface);padding:.9rem 1.3rem;border-radius:4px;border:1px solid var(--line);min-width:240px}
.pv{border:1px solid var(--line);background:var(--surface2);padding:.7rem .9rem;border-radius:4px}
.sw{display:inline-block;width:18px;height:18px;border-radius:3px;border:1px solid var(--line);vertical-align:middle}
details summary{cursor:pointer;color:var(--muted);font-size:.88rem}
.tree .child td:first-child{padding-left:2rem}
pre.code{background:var(--surface2);border:1px solid var(--line);padding:.7rem;overflow:auto;font-size:.82rem;border-radius:4px}
.help h4{margin:1.1rem 0 .3rem}.help p,.help li{color:var(--muted);font-size:.92rem}.help code{background:var(--line2);padding:0 .3rem;border-radius:3px}
@media(max-width:1000px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:820px){
 .app{grid-template-columns:minmax(0,1fr)}
 .side{position:fixed;left:0;top:0;bottom:0;width:240px;z-index:40;transform:translateX(-100%);transition:transform .15s}
 .side.open{transform:none;box-shadow:0 0 30px rgba(0,0,0,.25)}
 .menu-btn{display:inline-flex}
 .g2,.g3{grid-template-columns:minmax(0,1fr)}
 .content{padding:1rem .8rem 3rem}
 .tscroll{max-height:none}
 .clk-date,.saveind{display:none}
 .fg{grid-template-columns:minmax(0,1fr)}
}
@media(max-width:560px){.top form{display:none}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .v{font-size:1.1rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
body.rm *,body.rm *::before,body.rm *::after{animation:none!important;transition:none!important}
@media print{.side,.top,.tbar,.btn,#toasts{display:none!important}.app{display:block;height:auto}.content{overflow:visible}.main{height:auto}}

/* ---------- Ledgerbook human-centred refinement ---------- */
:root{
 --bg:#f3f1eb;--surface:#fffefa;--surface2:#f8f6f0;--ink:#292b26;--muted:#74766d;--faint:#99998f;
 --line:#e3dfd4;--line2:#eeeadf;--accent:#596a53;--accent-ink:#fffefa;--inc:#47745a;--exp:#a35f53;--sav:#536f82;
 --warn:#96713d;--inc-bg:#eaf1e9;--exp-bg:#f6ece8;--warn-bg:#f5efdf;--sel:#eff1e9;--rp:.42rem
}
[data-theme=dark]{
 --bg:#1d201e;--surface:#252925;--surface2:#222622;--ink:#e9e9e1;--muted:#a5a89d;--faint:#777d72;
 --line:#3a4039;--line2:#30362f;--accent:#a6b69a;--accent-ink:#1a211a;--inc:#8fbd9b;--exp:#d99a8b;--sav:#9bbad0;
 --warn:#d4b37a;--inc-bg:#28372d;--exp-bg:#3a2b27;--warn-bg:#3a3325;--sel:#2c342b
}
body{background:var(--bg);letter-spacing:.002em}
.app{grid-template-columns:238px minmax(0,1fr)}
.side{padding:1.15rem 0 1.2rem;background:var(--surface);border-right-color:var(--line)}
.brand{padding:.1rem 1.15rem 1.15rem;font-size:1rem;letter-spacing:0}
.side .ng{padding:1rem 1.25rem .42rem;font-size:.66rem;letter-spacing:.12em;color:var(--faint)}
.side a.nl{margin:.08rem .55rem;padding:.47rem .75rem;border-left:0;border-radius:6px;font-size:.91rem;transition:background-color .16s ease,color .16s ease,transform .16s ease}
.side a.nl:hover{background:var(--surface2);transform:translateX(2px)}
.side a.nl.on{background:var(--sel);color:var(--accent);font-weight:650;box-shadow:inset 2px 0 0 var(--accent)}
.top{height:58px;padding:0 1.45rem;background:var(--surface);border-bottom-color:var(--line)}
.content{padding:1.45rem 1.8rem 3.2rem}
.ph{margin-bottom:1.2rem;align-items:flex-end}
.ph h1{font-size:1.55rem;font-weight:560;letter-spacing:-.045em;line-height:1.15}
.ph .sub{margin-top:.28rem;font-size:.88rem;max-width:66ch;line-height:1.55}
.sh{margin:1.65rem 0 .7rem}.sh h3{font-size:.94rem;font-weight:650;letter-spacing:-.012em}
.btn{border-radius:6px;padding:.43rem .82rem;transition:background-color .15s ease,border-color .15s ease,box-shadow .15s ease,transform .15s ease}
.btn:hover{transform:translateY(-1px);box-shadow:0 3px 9px rgba(42,45,37,.07)}.btn:active{transform:translateY(0);box-shadow:none}
.btn.primary{background:var(--accent);border-color:var(--accent)}.btn.primary:hover{filter:none;background:color-mix(in srgb,var(--accent) 90%,#000 10%)}
input,select,textarea{border-radius:6px;padding:.43rem .6rem;transition:border-color .15s ease,box-shadow .15s ease}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 13%,transparent);outline:0}
.card,.kpi,.tw,.tscroll,.fpanel{border-radius:7px}
.card{padding:1rem 1.1rem;border-color:var(--line);box-shadow:0 1px 1px rgba(34,36,29,.018);transition:border-color .16s ease,box-shadow .16s ease,transform .16s ease}
.card:hover{border-color:color-mix(in srgb,var(--line) 55%,var(--accent) 45%);box-shadow:0 5px 16px rgba(42,45,37,.045);transform:translateY(-1px)}
.card h3{font-weight:650;letter-spacing:-.015em}
.kpi{padding:.8rem .95rem;border-color:var(--line);box-shadow:0 1px 1px rgba(34,36,29,.018)}
.kpi .l{letter-spacing:.09em;font-size:.68rem}.kpi .v{font-size:1.35rem;letter-spacing:-.035em;font-weight:620}
.tbl th,.grid th{letter-spacing:.075em}.tbl td{padding:.5rem .65rem}
.tw,.tscroll{box-shadow:0 1px 2px rgba(34,36,29,.025)}.grid th{background:var(--surface2)}
.grid tr:hover td{background:color-mix(in srgb,var(--surface2) 78%,var(--sel) 22%)}

   LEDGERBOOK — single-file personal finance database (IndexedDB)

const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];

/* Quick add: parses "coffee 180 food" / "+salary 45000 income" into a pre-filled form (never saves by itself). */
const QuickAdd={
 parse(text){const s0=String(text||'').trim();if(!s0)return{error:'Type something first, for example “coffee 180 food”.'};let type='expense',s=s0;if(s[0]==='+'){type='income';s=s.slice(1).trim()}
  const toks=s.split(/\s+/).filter(Boolean);let amt=null;
  for(let i=toks.length-1;i>=0;i--){if(/^\d+([.,]\d{1,2})?$/.test(toks[i])){amt=Money.parse(toks[i]);toks.splice(i,1);break}}
  if(amt==null||isNaN(amt)||amt<=0)return{error:'Include an amount greater than zero, for example “coffee 180 food”.'};
  let categoryId='';const last=toks[toks.length-1];
  if(last){const kind=type==='income'?'income':'expense';const c=State.categories.find(x=>!x.archived&&!x.parentId&&x.kind===kind&&x.name.toLowerCase()===last.toLowerCase());if(c){categoryId=c.id;toks.pop()}}
  return{type,amount:amt,categoryId,description:toks.join(' ')||(type==='income'?'Income':'Expense')}},
 card(){return`<div class="card qa"><div class="qa-head"><h3>Quick add</h3><span class="xs muted">Opens a pre-filled form. Nothing is saved until you confirm.</span></div><form id="qaForm" class="qa-row" autocomplete="off"><input id="qaIn" maxlength="200" aria-label="Quick add transaction" placeholder="coffee 180 food   ·   +salary 45000 income   (press Enter)"><button class="btn primary" type="submit">Review</button></form><div id="qaErr" class="small exp" role="status" style="min-height:1.25em;margin-top:.3rem"></div></div>`},
 bind(root){const f=root.querySelector('#qaForm');if(!f)return;f.onsubmit=e=>{e.preventDefault();const inp=f.querySelector('#qaIn'),err=root.querySelector('#qaErr'),r=QuickAdd.parse(inp.value);if(r.error){err.textContent=r.error;return}err.textContent='';inp.value='';TxForm.open(null,{type:r.type,prefill:{amount:r.amount,description:r.description,categoryId:r.categoryId}})}},
 attn(bs){const soon=Rec.pending(7).slice(0,6),near=bs.filter(x=>x.pct>=80).slice(0,5);
  const rows=soon.map(p=>`<li><span class="badge ${p.due?'warn':''}">${p.due?'Due':'Upcoming'}</span><span>${esc(p.r.name)}</span><span class="muted small">${esc(Dt.disp(p.date))}</span><span class="r ${p.r.type==='income'?'inc':'exp'}">${Money.fmt(p.r.amount,(State.m.accounts.get(p.r.accountId)||{}).currency)}</span></li>`)
   .concat(near.map(x=>`<li><span class="badge ${x.pct>100?'exp':'warn'}">Budget</span><span>${esc(x.b.name)}</span><span class="muted small">${x.pct.toFixed(0)}% used</span><span class="r">${Money.fmt(x.spent)} / ${Money.fmt(x.b.amount)}</span></li>`));
  return`<div class="card attn"><div class="qa-head"><h3>Needs attention</h3><span class="xs muted">Recurring items in the next 7 days · budgets above 80%</span></div>${rows.length?`<ul class="attn-list">${rows.join('')}</ul>`:'<p class="muted small" style="margin:0">Nothing due in the next 7 days and no budget above 80%.</p>'}</div>`}
};

   return{head:['Month','Income','Expenditure','Net savings','Savings rate','Cumulative'],types:['t','m','m','m','p','m'],rows,foot:['Total',ag.inc,ag.exp,ag.inc-ag.exp,Calc.rate(ag.inc,ag.exp),ag.inc-ag.exp],charts:[{title:'Net savings by month',draw:h=>Charts.bars(h,{labels:ms.map(mlabel),series:[{name:'Net',color:Charts.col.sav,data:rows.map(x=>x[3])}],neg:Charts.col.exp})},{title:'Savings rate',draw:h=>Charts.line(h,{labels:ms.map(mlabel),series:[{name:'Rate',color:Charts.col.sav,data:rows.map(x=>x[4])}],axis:v=>v.toFixed(0)+'%',fmt:v=>v.toFixed(1)+'%'})}]}}

   const rows=ms.map(m=>{const x=ag.byMonth.get(m)||{inc:0,exp:0};return[mlabel(m),x.inc,x.exp,x.inc-x.exp,open+(cm[m]||0)]});
   return{head:['Month','Inflow (income)','Outflow (expenditure)','Net cash flow','Closing balance*'],types:['t','m','m','m','m'],rows,foot:['Total',ag.inc,ag.exp,ag.inc-ag.exp,null],note:'*Closing balance = opening balances of active accounts + cumulative income − expenditure (base currency, transfers net to zero).',charts:[{title:'Inflow vs outflow',draw:h=>Charts.bars(h,{labels:ms.map(mlabel),series:[{name:'Inflow',color:Charts.col.inc,data:rows.map(x=>x[1])},{name:'Outflow',color:Charts.col.exp,data:rows.map(x=>x[2])}]})},{title:'Net cash flow',draw:h=>Charts.bars(h,{labels:ms.map(mlabel),series:[{name:'Net',color:Charts.col.inc,data:rows.map(x=>x[3])}],neg:Charts.col.exp})}]}}

   return{head:['Category','Kind','Income','Expenditure','Net','Entries'],types:['t','t','m','m','m','i'],rows,foot:['Total','',ag.inc,ag.exp,ag.inc-ag.exp,ag.incN+ag.expN],charts:[{title:'Expenditure by category',draw:h=>Charts.hbars(h,{items:catItems(ag.catExp).sort((a,b)=>b.value-a.value)})},{title:'Income by source',draw:h=>Charts.hbars(h,{items:catItems(ag.catInc).sort((a,b)=>b.value-a.value)})}]}}

   return{head:['Budget','Window','Allocated','Spent','Remaining','Used'],types:['t','t','m','m','m','p'],rows,foot:rows.length?['Total','',sum(rows,x=>x[2]),sum(rows,x=>x[3]),sum(rows,x=>x[4]),null]:null,charts:[{title:'Actual vs allocated',draw:h=>Charts.hbars(h,{items:rows.slice(-12).map(x=>({label:x[0]+' · '+x[1].split(' – ')[0],value:x[3],max:Math.max(x[2],x[3]),alloc:x[2],pct:x[5]||0,color:{ok:Charts.col.inc,warn:Charts.col.warn,over:Charts.col.exp}[Budgets.state(x[5]||0)]})),keepZero:true,fmt:(v,it)=>`${Money.fmt(v)} / ${Money.fmt(it.alloc)}`})}]}}

   return{head:['Rule','Type','Frequency','Rule amount','Posted','Posted total','Due / unposted'],types:['t','t','t','m','i','m','i'],rows,foot:null,note:'Posted = real transactions created from the rule within the period. Unposted occurrences are scheduled only and are not part of your ledger.',charts:[]}}

   const num=['number','decimal','currency'].includes(fd.type),grp=new Map(),vals=[];

   const rows=[...grp].sort((a,b)=>b[1].n-a[1].n).map(([k,g])=>[k,g.n,g.inc,g.exp]);let note=`Column “${fd.name}” (${fd.type}). Only transactions in the period that hold a value are included.`;
   if(num&&vals.length){const s=vals.reduce((a,b)=>a+b,0),f=v=>fd.type==='currency'?Money.fmt(Math.round(v)):(Math.round(v*100)/100).toLocaleString();note+=` Values: count ${vals.length}, sum ${f(s)}, average ${f(s/vals.length)}, min ${f(Math.min(...vals))}, max ${f(Math.max(...vals))}.`}
   return{head:[fd.name,'Entries','Income','Expenditure'],types:['t','i','m','m'],rows,foot:null,note,charts:num?[]:[{title:'Entries by value',draw:h=>Charts.hbars(h,{items:rows.map(x=>({label:x[0],value:x[1]})),fmt:v=>String(v)})}]}}
 }
}

/* ---------- Analytics & insights ---------- */
PAGES.analytics=async(el,alive)=>{
 const t=Dt.today(),ym=t.slice(0,7),all=await Analytics.period(null,null);if(!alive())return;
 if(!Per.st.cmpA){Per.st.cmpA={key:'this-month',from:'',to:''};Per.st.cmpB={key:'last-month',from:'',to:''}}
 const lm=Dt.addMonths(Dt.monthStart(t),-1),dayN=+t.slice(8),lmSame=Dt.addDays(lm,dayN-1)>Dt.monthEnd(lm)?Dt.monthEnd(lm):Dt.addDays(lm,dayN-1),rA=Per.range('cmpA'),rB=Per.range('cmpB');
 const [mtd,lmtd,A,B]=await Promise.all([Analytics.period(Dt.monthStart(t),t),Analytics.period(lm,lmSame),Analytics.period(rA.from,rA.to),Analytics.period(rB.from,rB.to)]);const bs=await Budgets.current();if(!alive())return;
 const ins=[];
 if(!all.count)ins.push('There are no transactions yet — insights appear once you record some.');
 else{
  const cats=catItems(all.catExp).sort((a,b)=>b.value-a.value);if(cats[0])ins.push(`Highest spending category overall: <b>${esc(cats[0].label)}</b> at ${Money.fmt(cats[0].value)} (${(cats[0].value/all.exp*100).toFixed(1)}% of all expenditure).`);
  let mx=null,ms=null;for(const[m,x]of all.byMonth){if(!mx||x.exp>mx.x.exp)mx={m,x};if(!ms||x.inc-x.exp>ms.x.inc-ms.x.exp)ms={m,x}}
  if(mx&&mx.x.exp>0)ins.push(`Month with the highest expenditure: <b>${esc(Dt.monthLabel(mx.m))}</b> (${Money.fmt(mx.x.exp)}).`);
  if(ms)ins.push(`Month with the highest savings: <b>${esc(Dt.monthLabel(ms.m))}</b> (${Money.fmt(ms.x.inc-ms.x.exp)} net).`);
  if(lmtd.exp>0){const d=mtd.exp-lmtd.exp;ins.push(`Spending so far this month (${Money.fmt(mtd.exp)}) is <b class="${d>0?'exp':'inc'}">${Money.fmt(Math.abs(d))} ${d>=0?'higher':'lower'}</b> (${Math.abs(d/lmtd.exp*100).toFixed(0)}%) than the same ${dayN} day(s) of last month (${Money.fmt(lmtd.exp)}).`)}
  const n=Dt.monthsBetween(all.min.slice(0,7),ym).length;ins.push(`Average monthly expenditure: <b>${Money.fmt(Math.round(all.exp/n))}</b>; average monthly savings: <b>${Money.fmt(Math.round((all.inc-all.exp)/n))}</b> (over ${n} month(s) since ${esc(Dt.monthLabel(all.min.slice(0,7)))}).`);
  const done=Dt.monthsBetween(all.min.slice(0,7),ym).filter(m=>m<ym),agg=l=>l.reduce((s,m)=>{const x=all.byMonth.get(m)||{inc:0,exp:0};return{inc:s.inc+x.inc,exp:s.exp+x.exp}},{inc:0,exp:0});
  if(done.length>=6){const l3=agg(done.slice(-3)),p3=agg(done.slice(-6,-3)),a=Calc.rate(l3.inc,l3.exp),b=Calc.rate(p3.inc,p3.exp);if(a!=null&&b!=null)ins.push(`Savings rate over the last 3 completed months was <b>${a.toFixed(1)}%</b> versus <b>${b.toFixed(1)}%</b> in the 3 months before (${a>=b?'+':'−'}${Math.abs(a-b).toFixed(1)} points).`)}

const Backup={
 FORMAT:'ledgerbook-backup',VERSION:1,STORES:['transactions','accounts','categories','budgets','goals','recurring','customFields','tags','paymentMethods','settings','deleted','audit'],

  for(const s of Backup.STORES){let rows=await DB.getAll(s);if(s==='settings')rows=rows.filter(r=>r.key!=='lock'&&!r.key.startsWith('__'));head.counts[s]=rows.length;parts.push(`"${s}":`+JSON.stringify(rows))}
  return new Blob([JSON.stringify(head).slice(0,-1)+',"stores":{',parts.join(','),'}}'],{type:'application/json'})},
 async download(){const b=UI.busy('Preparing backup…');try{const blob=await Backup.build();download(`ledgerbook-backup-${stamp()}.json`,blob,'application/json');await Settings.set('lastBackup',Date.now());Notify.ok('Backup downloaded — store it somewhere safe')}catch(e){Notify.error('Backup failed: '+e.message)}finally{b.done()}},
 async downloadEncrypted(){if(!Crypt.ok())return Notify.error('Encryption needs the Web Crypto API, which is unavailable in this context.');
  const pw=await askPass('Encrypt backup',true,'The backup is encrypted with AES-256-GCM using a key derived from your passphrase (PBKDF2-SHA256, 250,000 iterations). <b>If you lose the passphrase the backup cannot be recovered.</b> Regular browser storage (IndexedDB) is <b>not</b> encrypted by this.');if(!pw)return;

 validate(o){const E=[],W=[];if(!o||typeof o!=='object'||Array.isArray(o))return{errors:['The file is not a Ledgerbook backup.'],warnings:W};
  if(o.format!==Backup.FORMAT)E.push('Unrecognised file format (expected “'+Backup.FORMAT+'”).');if(typeof o.version!=='number')E.push('Missing backup version.');else if(o.version>Backup.VERSION)E.push(`This backup (version ${o.version}) was created by a newer version of the app.`);
  if(!o.stores||typeof o.stores!=='object')E.push('Missing data stores.');if(E.length)return{errors:E,warnings:W};
  for(const s of Backup.STORES){const a=o.stores[s];if(a===undefined)continue;if(!Array.isArray(a)){E.push(`Store “${s}” is not a list.`);continue}const k=s==='settings'?'key':'id';let bad=0;for(const x of a)if(!x||typeof x!=='object'||typeof x[k]!=='string'||!x[k])bad++;if(bad)E.push(`Store “${s}” has ${bad} record(s) without a valid ${k}.`)}

  const rows=[];for(const s of Backup.STORES){const a=obj.stores[s];if(!a)continue;let ex=0;if(s!=='settings'){const keys=new Set(await DB.getAllKeys(s));ex=a.filter(x=>keys.has(x.id)).length}rows.push([s,a.length,s==='settings'?'—':await DB.count(s),s==='settings'?'—':ex])}
  UI.dialog({title:'Restore backup',wide:true,body:`<p style="margin-top:0" class="small">${esc(name||'Backup')} · created ${esc(Dt.dispISO(obj.createdAt))} · version ${obj.version}</p>${v.warnings.map(w=>`<div class="note warn" style="margin-bottom:.5rem">${esc(w)}</div>`).join('')}<div class="tw"><table class="tbl"><thead><tr><th>Data</th><th class="r">In backup</th><th class="r">Now in database</th><th class="r">Duplicate IDs</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r[0])}</td><td class="r">${r[1].toLocaleString()}</td><td class="r">${typeof r[2]==='number'?r[2].toLocaleString():r[2]}</td><td class="r">${r[3]}</td></tr>`).join('')}</tbody></table></div>
   <div class="grp" style="flex-direction:column;margin-top:.8rem"><label><input type="radio" name="mode" value="merge" checked> <span><b>Merge — add only new records</b>; records whose ID already exists are kept as they are.</span></label><label><input type="radio" name="mode" value="overwrite"> <span><b>Merge — overwrite duplicates</b> with the backup version; other records untouched.</span></label><label><input type="radio" name="mode" value="replace"> <span class="exp"><b>Replace everything</b> — erases current financial data and restores the backup. A safety snapshot is stored first.</span></label>${F.inp('confirm','','placeholder="Type REPLACE to confirm a full replacement"')}</div>`,
   actions:[{label:'Cancel',run(){}},{label:'Restore',primary:true,async run(c){const f=c.read();if(f.mode==='replace'&&f.confirm!=='REPLACE'){c.error([{field:'confirm',msg:'Type REPLACE to confirm.'}]);return false}await Backup.apply(obj,f.mode)}}]})},

  if(mode==='replace'){b.set('Storing safety snapshot…');await Snapshot.create('Before restore (replace)')}

  await DB.write(stores,tx=>{for(const s of stores){const os=tx.objectStore(s);if(mode==='replace'&&s!=='settings')os.clear();for(const row of obj.stores[s]){if(s==='settings'&&(row.key==='lock'||row.key.startsWith('__')))continue;if(mode==='merge'&&have[s]&&have[s].has(row.id))continue;os.put(row);n++}}});

 if(need.length)return UI.info('Missing columns',`<p>Required column(s) not found: <b>${need.join(', ')}</b>.</p><p class="small muted">Recognised headers: Date, Type (income/expense/transfer), Amount, Account, To Account, Category, Description, Payee, Payment Method, Tags, Notes, Reference. Exporting transactions from this app produces a compatible file.</p>`);
 UI.dialog({title:'Import transactions from CSV',body:`<p style="margin-top:0" class="small">${(rows.length-1).toLocaleString()} data row(s) found in ${esc(file.name)}.</p><div class="fg">${F.f('Account for rows without an account',F.sel('acc',activeAccounts().map(a=>[a.id,a.name]),S.defaultAccount))}${F.f('Date format in file',F.sel('df',[['ymd','YYYY-MM-DD'],['dmy','DD/MM/YYYY or DD-MM-YYYY'],['mdy','MM/DD/YYYY']],'ymd'))}</div><p class="hint">Unknown categories, tags and accounts named in the file are created/matched by name (accounts must already exist). Negative amounts are treated as positive for the given type. Invalid rows are skipped and listed.</p>`,
  actions:[{label:'Cancel',run(){}},{label:'Validate & import',primary:true,async run(c){const f=c.read(),g=(r,n)=>{const i=col(n);return i>=0?(r[i]||'').trim():''},accBy=n=>State.accounts.find(a=>a.name.toLowerCase()===n.toLowerCase()),newCats=new Map(),newTags=new Map(),good=[],errs=[];
   const conv=s=>{let m;if(f.df==='ymd')return s;if(m=/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/.exec(s))return f.df==='dmy'?`${m[3]}-${Dt.pad(m[2])}-${Dt.pad(m[1])}`:`${m[3]}-${Dt.pad(m[1])}-${Dt.pad(m[2])}`;return s};
   const catId=(name,kind)=>{if(!name)return'';let c=State.categories.find(x=>!x.parentId&&x.kind===kind&&x.name.toLowerCase()===name.toLowerCase());if(c)return c.id;const k=kind+'|'+name.toLowerCase();if(!newCats.has(k))newCats.set(k,{id:uid(),name,kind,parentId:'',color:Charts.pal[(State.categories.length+newCats.size)%10],description:'',archived:false,createdAt:nowISO(),updatedAt:nowISO()});return newCats.get(k).id};
   const tagId=n=>{let t=State.tags.find(x=>x.name.toLowerCase()===n.toLowerCase());if(t)return t.id;const k=n.toLowerCase();if(!newTags.has(k))newTags.set(k,{id:uid(),name:n,color:'#7a7f87',createdAt:nowISO(),updatedAt:nowISO()});return newTags.get(k).id};
   rows.slice(1).forEach((r,i)=>{const type=g(r,'type').toLowerCase(),a=g(r,'account')?accBy(g(r,'account')):State.m.accounts.get(f.acc),b=g(r,'to account')?accBy(g(r,'to account')):null,pm=g(r,'payment method')?State.paymentMethods.find(p=>p.name.toLowerCase()===g(r,'payment method').toLowerCase()):null;
    if(g(r,'account')&&!a){errs.push(`Row ${i+2}: unknown account “${g(r,'account')}”`);return}if(type==='transfer'&&g(r,'to account')&&!b){errs.push(`Row ${i+2}: unknown destination account`);return}
    const amt=g(r,'amount').replace(/^-/,''),tags=g(r,'tags').split(/[;,]/).map(x=>x.trim()).filter(Boolean).map(tagId),tm=g(r,'time');let allocationMode='single',allocations=[];
    const allocationText=g(r,'account allocations');if(allocationText){try{const parsed=JSON.parse(allocationText);if(!Array.isArray(parsed))throw new Error('not an array');allocations=parsed.map(x=>{const aa=accBy(String(x.account||''));if(!aa)throw new Error('unknown allocation account '+String(x.account||''));return{accountId:aa.id,amount:String(x.amount||'')}});if(allocations.length>1)allocationMode='split'}catch(err){errs.push(`Row ${i+2}: invalid Account Allocations (${err.message})`);return}}
    const v=Valid.transaction({type,date:conv(g(r,'date')),time:/^\d{2}:\d{2}$/.test(tm)?tm:'00:00',amount:amt,accountId:a?a.id:'',toAccountId:b?b.id:'',categoryId:type==='transfer'?'':catId(g(r,'category'),type),description:g(r,'description'),payee:g(r,'payee'),paymentMethodId:pm?pm.id:'',tags,notes:g(r,'notes'),reference:g(r,'reference'),custom:{},allocationMode,allocations:JSON.stringify(allocations)},{lenient:true});
    if(v.errors.length)errs.push(`Row ${i+2}: ${v.errors[0].msg}`);else{const now=nowISO();good.push({...v.tx,createdAt:now,updatedAt:now})}});
   if(!good.length){c.error(['No valid rows. '+errs.slice(0,5).join(' · ')]);return false}
   if(errs.length&&!await UI.confirm({title:'Some rows are invalid',html:`<p style="margin-top:0"><b>${good.length.toLocaleString()}</b> row(s) are valid; <b>${errs.length.toLocaleString()}</b> will be skipped:</p><ul class="small">${errs.slice(0,8).map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`,confirm:'Import valid rows'}))return false;
   const bz=UI.busy('Importing…');try{await DB.write(['transactions','categories','tags','audit'],tx=>{newCats.forEach(x=>tx.objectStore('categories').put(x));newTags.forEach(x=>tx.objectStore('tags').put(x));const os=tx.objectStore('transactions');good.forEach(x=>os.put(x));tx.objectStore('audit').put(Audit.rec('import','*','create',`CSV import: ${good.length} transactions from ${file.name}`))});await State.reload();Notify.ok(`Imported ${good.length.toLocaleString()} transaction(s)${errs.length?`, skipped ${errs.length}`:''}`)}finally{bz.done()}}}]})}
PAGES.data=async(el,alive)=>{

 const snaps=(await DB.getMany('archives',snapKeys)).sort((a,b)=>a.createdAt<b.createdAt?1:-1);if(!alive())return;
 const pct=est&&est.quota?est.usage/est.quota*100:null,lastSave=DB.lastSave||S.lastSave,sample=State.accounts.some(a=>a.sample);
 const btn=(a,l,k='')=>`<button class="btn ${k}" data-d="${a}">${l}</button>`;
 el.innerHTML=`${UI.pageHead('Data & Backup','Storage status, export, backup, restore and maintenance')}

  ${pct>80?'<div class="note err" style="margin-top:.7rem">Browser storage is more than 80% full. Export a backup and free space.</div>':''}

 <div class="card" style="margin-top:.9rem"><h3>Automatic change journal</h3><p class="small muted" style="margin:.2rem 0 .5rem">Every committed database change is recorded in IndexedDB's audit history. You can also connect the folder containing <code>index.html</code> so Ledgerbook appends a detailed line to a JSONL file after each successful change.</p><div class="log-state"><i class="log-dot ${AutoLog.status==='connected'?'ok':AutoLog.status==='error'?'err':AutoLog.status==='permission-required'||AutoLog.status==='reconnect-required'?'warn':''}"></i><b>${AutoLog.status==='connected'?'External log connected':AutoLog.status==='permission-required'?'Permission needed':AutoLog.status==='reconnect-required'?'Reconnect required':AutoLog.status==='error'?'External log write failed':'IndexedDB journal active'}</b><span class="muted">${AutoLog.status==='connected'?'· '+esc(AutoLog.fileName):''}</span></div><div class="log-actions">${btn('log-connect',AutoLog.status==='connected'?'Choose a different folder…':'Choose app folder & connect','primary')}${AutoLog.status==='permission-required'||AutoLog.status==='reconnect-required'||AutoLog.status==='error'?btn('log-reconnect','Reconnect log folder'):''}${AutoLog.status==='connected'?btn('log-test','Write test entry'):''}${AutoLog.status==='connected'?btn('log-disconnect','Disconnect') : ''}${btn('log-download','Download in-app journal')}</div><p class="log-meta" style="margin:.6rem 0 0">Choose the same folder that contains <code>index.html</code>. Ledgerbook will create <code>${AutoLog.fileName}</code> and a timestamped full JSON baseline backup there. The log appends change details after each successful IndexedDB transaction. Browser permission may need renewing after a restart. ${AutoLog.lastWrite?'Last external write: '+esc(new Date(AutoLog.lastWrite).toLocaleString()):''} ${AutoLog.lastError?' · '+esc(AutoLog.lastError):''}</p><div class="note warn" style="margin-top:.65rem">The sidecar log contains financial record changes in readable JSON. Keep the folder private. It complements, but does not replace, regular full backups. Large bulk writes are recorded as summaries to keep the app responsive.</div>${!AutoLog.supported()?'<div class="note warn" style="margin-top:.5rem">This browser does not expose the folder-writing API. The in-app IndexedDB journal still records changes and can be downloaded as JSONL.</div>':''}</div>

 <div class="card"><h3>Safety snapshots</h3>${snaps.length?`<table class="tbl small"><tbody>${snaps.map(s=>`<tr data-sid="${esc(s.id.slice(2))}"><td>${esc(Dt.dispISO(s.createdAt))}<div class="xs muted">${esc(s.reason)} · ${(s.size/1048576).toFixed(1)} MB</div></td><td class="r"><button class="lnk" data-d="snap-dl">Download</button><button class="lnk" data-d="snap-rs">Restore</button><button class="lnk d" data-d="snap-del">Delete</button></td></tr>`).join('')}</tbody></table>`:'<div class="small muted">None. A snapshot is stored automatically before a full replace/erase (the latest 3 are kept).</div>'}</div></div>

   case'sample':{UI.dialog({title:'Generate sample data',body:`<p class="small" style="margin-top:0">Creates flagged sample accounts and transactions spread over the last 24 months so you can evaluate charts, search and performance. Your own data is untouched, and the sample can be removed completely afterwards.</p>${F.f('Number of transactions',F.sel('n',[1000,10000,50000,100000,250000].map(x=>[x,x.toLocaleString()]),10000))}`,actions:[{label:'Cancel',run(){}},{label:'Generate',primary:true,async run(c){const n=+c.read().n;c.close();await genSample(n);App.refresh();return false}}]});return}

   case'snap-dl':{const d=await DB.get('archives','d:'+row.dataset.sid);if(d)download(`ledgerbook-snapshot-${stamp()}.json`,d.data,'application/json');return}

  <div class="card" style="margin-bottom:.8rem"><div class="ph" style="margin-bottom:.35rem"><div><h2 style="font-size:1.12rem">Ledgerbook · Responsive zoom and workspace layout</h2><div class="sub">Version 1.7.1 · 15 November 2026</div></div><div class="spacer"></div><span class="badge">Current release</span></div>
   <div class="release-item"><h4>Centered wide-screen workspace</h4><p>Fixed the large-screen layout so the main content no longer stays stuck to the left with unused space on the right. The workspace now uses the available width at normal sizes and is centered on very wide viewports.</p></div>

  </div>

  <div class="release-item"><h4>Split one income across multiple accounts</h4><p>Income can now be allocated to two or more accounts in one transaction. Enter each account and its portion; the portions must add up exactly to the income amount. Account balances receive their individual shares, while income totals, category reports and savings calculations count the receipt only once.</p></div>
  <div class="release-item"><h4>Editing, search, account history and exports</h4><p>Split destinations remain editable, each destination account can find the transaction in its history, account names are searchable, CSV exports include allocation details, and CSV imports restore those splits. JSON backups keep the allocation data with the original transaction.</p></div>
  <div class="release-item"><h4>Theme-aware date and time panels</h4><p>The transaction form now uses custom calendar and time panels that follow the active Ledgerbook light/dark theme, with rounded corners, selected-day styling, month navigation and quick time selection. Other native date/time fields also follow the active colour scheme.</p></div>
  <div class="release-item"><h4>Data continuity</h4><p>No records are cleared or rewritten. Existing transactions without allocations continue to behave as single-account entries. The <code>LedgerbookDB</code> name, IndexedDB version and object-store schema remain unchanged; allocations are stored as an optional field on the existing transaction record.</p></div>
 </div>
 <div class="card" style="margin-bottom:.8rem"><div class="ph" style="margin-bottom:.35rem"><div><h2 style="font-size:1.12rem">Ledgerbook · Transfer payment method support</h2><div class="sub">Version 1.6.0 · 14 November 2026</div></div><div class="spacer"></div><span class="badge">Previous release</span></div>
  <div class="release-item"><h4>Payment method for transfers</h4><p>Added the existing Payment method dropdown to Transfer transactions, alongside Income and Expense. Choose a configured method such as Cash, UPI, Debit Card, Credit Card, Net Banking or Cheque when recording or editing a transfer.</p></div>
  <div class="release-item"><h4>Saved with the transaction</h4><p>The selected method is stored in the existing <code>paymentMethodId</code> field and remains available when the transfer is edited. Existing payment-method values and archived methods on historical records are preserved.</p></div>

/* ---------- Help ---------- */
PAGES.help=async el=>{el.innerHTML=`${UI.pageHead('Help & formulas','Reference, definitions and known limitations')}<div class="card help">
 <h4>Appearance</h4><p>Choose one of 20 restrained colour palettes in Settings → Appearance. The palette is separate from light/dark/system mode and is saved in IndexedDB.</p><h4>Opening and storage</h4><p>Open <code>index.html</code> in a modern Chromium browser (Chrome, Edge) — no server or internet is needed. Everything is saved automatically in IndexedDB. The in-app change journal is written in the same transaction as each successful database change. For a separate log file beside the HTML, open Data &amp; Backup and choose the folder containing <code>index.html</code>; browser security requires that explicit folder permission. Keep the baseline JSON backup and regular backups.</p>
 <h4>Formulas</h4><ul><li><b>Amounts</b> are stored as integer minor units (paise). Income/expense amounts are positive; the type gives direction.</li><li><b>Income / Expenditure</b> = Σ base-currency amount of income / expense transactions. Transfers are never included.</li><li><b>Net cash flow / Net savings</b> = Income − Expenditure.</li><li><b>Savings rate</b> = Net savings ÷ Income × 100 (shown as “—” when income is zero).</li><li><b>Account balance</b> = opening balance + income allocations − expenditure + transfers in − transfers out (in the account’s currency). A split income credits each chosen account by its allocated portion, while the full income is counted once in reports.</li><li><b>Net worth</b> = Σ balances of active accounts converted with the rate table in Settings.</li><li><b>Budget utilisation</b> = spent ÷ allocated × 100 for the current budget window; warning from 80%.</li><li><b>Goal progress</b> = Σ contributions − withdrawals ÷ target. Required contribution = remaining ÷ months (or weeks) until the target date.</li><li><b>Average daily expenditure</b> = expenditure ÷ days from the period start to today (or period end).</li></ul>
 <h4>Archive vs delete</h4><p>Archiving hides a record from default lists but keeps it in all calculations. Deleting moves it to the trash (Data &amp; Backup), where it can be restored. Deleting categories, accounts or columns in use always asks what to do with history.</p>
 <h4>Keyboard shortcuts</h4><ul><li><code>N</code> add transaction · <code>/</code> focus search · <code>?</code> open this page</li><li><code>Ctrl/⌘ + Enter</code> save an open form · <code>Esc</code> close a dialog</li><li>Table: click header to sort, <code>Shift</code>+click for multi-column sort, drag header to reorder, drag the right edge to resize; double-click a row to edit.</li></ul>
 <h4>Known limitations</h4><ul><li>Browser storage is per browser profile and, for <code>file://</code>, tied to the file’s path. Clearing site data deletes the database — keep backups. A sidecar change journal needs user-granted folder access; the browser cannot silently write to the HTML file’s folder.</li><li>Firefox and Safari restrict or vary IndexedDB behaviour for local files; use Chrome or Edge for direct file use.</li><li>Analytics read the date range from the index and aggregate in memory; very large ranges (hundreds of thousands of rows) take a moment on first load and are cached until data changes. Tables are paginated and never render the whole dataset.</li><li>The interface lock does not encrypt IndexedDB. Only encrypted backups are encrypted.</li><li>All currencies are formatted with two decimals. Exchange rates are manual; each transaction stores its own rate snapshot.</li><li>Multi-tab editing is supported by reloading state on change notifications, but avoid editing the same record in two tabs.</li></ul>
 <h4>Testing</h4><p>Use <i>Data &amp; Backup → Run self-tests</i> (calculations, validation, CSV, backup validation, encryption, database probe), <i>Check data integrity</i> (orphan references, balance reconciliation) and <i>Generate sample data + Run benchmark</i> for large datasets.</p></div>`};

/* ---------- Clock (seconds digits roll up subtly) ---------- */
const H12=()=>S.timeFormat==='12'||(S.timeFormat==='auto'&&!!new Intl.DateTimeFormat(undefined,{hour:'numeric'}).resolvedOptions().hour12);
const Clock={
 update(force){const c=$('#clock');if(!c||!S.clockVisible)return;const d=new Date(),m=Dt.pad(d.getMinutes()),s=Dt.pad(d.getSeconds());let h=d.getHours(),ap='';if(H12()){ap=h>=12?'PM':'AM';h=h%12||12}else h=Dt.pad(h);
  $('#clkHM').textContent=h+':'+m;$('#clkAP').textContent=ap;const dt=$('#clkDate');dt.hidden=!S.clockDate;if(S.clockDate)dt.textContent=d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  const sec=S.clockSeconds,s1=$('#s1'),s2=$('#s2'),sep=$('#clkHM').nextElementSibling;s1.hidden=s2.hidden=sep.hidden=!sec;
  if(sec){for(const[el,v]of[[s1,s[0]],[s2,s[1]]])if(el.textContent!==v){el.textContent=v;if(!force){el.classList.remove('tick');void el.offsetWidth;el.classList.add('tick')}}}},
 start(){Clock.update(true);const loop=()=>{Clock.update();setTimeout(loop,1000-(Date.now()%1000)+5)};setTimeout(loop,1000-(Date.now()%1000)+5)}
};

const App={tok:0,keep:false,lastRoute:null,
 route(){const h=location.hash.replace(/^#\/?/,'')||'dashboard';return PAGES[h]?h:'dashboard'},
 async render(){const id=App.route(),routeChanged=App.lastRoute!==id,tok=++App.tok,alive=()=>tok===App.tok,view=$('#view'),top=App.keep?view.scrollTop:0;view.onclick=null;view.onchange=null;view.oninput=null;
  $$('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===id));document.title=((NAV.flatMap(g=>g[1]).find(x=>x[0]===id)||[0,'Ledgerbook'])[1])+' — Ledgerbook';
  try{await PAGES[id](view,alive)}catch(e){console.error(e);if(alive())view.innerHTML=`<div class="note err"><b>This page could not be displayed.</b><br>${esc(e.message||e)}</div>`}
  if(alive()){if(routeChanged){view.classList.remove('route-enter');void view.offsetWidth;view.classList.add('route-enter')}else{view.classList.remove('route-enter')}if(App.keep)view.scrollTop=top;else{view.scrollTop=0}App.keep=false;App.lastRoute=id}},
 refresh(){App.keep=true;return App.render()}
};

(async function init(){

 $('#app').hidden=false;$('#boot').remove();Clock.start();

 App.render()
